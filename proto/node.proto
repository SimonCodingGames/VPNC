syntax = "proto3";
package vpnc.node.v1;

service NodeService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc StreamConfig(StreamConfigRequest) returns (stream ConfigUpdate);
  rpc ReportHealth(HealthReport) returns (HealthAck);
  rpc ReportPeerLocation(PeerLocationReport) returns (PeerLocationAck);
  rpc AckConfig(AckConfigRequest) returns (AckConfigResponse);
}

message RegisterRequest {
  string join_token = 1;
  string node_name = 2;
  string role = 3;
  string public_key_pem = 4;
}

message RegisterResponse {
  string node_id = 1;
  string credential = 2;
  uint64 initial_config_version = 3;
}

message StreamConfigRequest {
  string node_id = 1;
  uint64 last_applied_version = 2;
}

message ConfigUpdate {
  uint64 version = 1;
  bool full_snapshot = 2;
  bytes payload = 3;
}

message AckConfigRequest {
  string node_id = 1;
  uint64 applied_version = 2;
}

message AckConfigResponse {}

message HealthReport {
  string node_id = 1;
  int64 unix_ts = 2;
  map<string, string> metrics = 3;
}

message HealthAck {}

message PeerLocationReport {
  string node_id = 1;
  string peer_public_key = 2;
  string tunnel_ip = 3;
}

message PeerLocationAck {}
