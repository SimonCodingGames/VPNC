# Coolify Build Pack: Docker Compose
# Domain: set SERVICE_FQDN_CONTROL_8080 (Coolify magic) — no HTTP ports published.
# gRPC 50051 is published so nodes can connect directly (see docs/deploy-coolify.md).
#
# Postgres startet und legt DB/User automatisch an. Passwort steht hier fest
# (nur intern im Compose-Netzwerk, Port nicht veröffentlicht).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vpnc
      POSTGRES_PASSWORD: vpnc-coolify-internal
      POSTGRES_DB: vpnc
    volumes:
      - vpnc_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpnc -d vpnc"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  control:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      VPNC_DATABASE_URL: postgres://vpnc:vpnc-coolify-internal@postgres:5432/vpnc
      VPNC_HTTP_BIND: 0.0.0.0:8080
      VPNC_GRPC_BIND: 0.0.0.0:50051
      VPNC_MASTER_KEY: ${VPNC_MASTER_KEY:?VPNC_MASTER_KEY fehlt (openssl rand -hex 32)}
      VPNC_COOKIE_SECURE: ${VPNC_COOKIE_SECURE:-true}
      VPNC_TRUST_FORWARDED_HEADERS: ${VPNC_TRUST_FORWARDED_HEADERS:-true}
      VPNC_SESSION_HOURS: ${VPNC_SESSION_HOURS:-24}
      VPNC_STATIC_DIR: /app/static
      VPNC_NODE_BINARIES_DIR: /app/binaries
      VPNC_PUBLIC_URL: ${SERVICE_FQDN_CONTROL_8080:-}
      VPNC_PUBLIC_GRPC: ${VPNC_PUBLIC_GRPC:?VPNC_PUBLIC_GRPC fehlt (z.B. http://HOST:50051)}
      VPNC_BOOTSTRAP_EMAIL: ${VPNC_BOOTSTRAP_EMAIL:-}
      VPNC_BOOTSTRAP_PASSWORD: ${VPNC_BOOTSTRAP_PASSWORD:-}
      VPNC_TELEMETRY__JSON: "true"
      VPNC_TELEMETRY__FILTER: ${VPNC_TELEMETRY__FILTER:-info}
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vpnc_pg_data:
